<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05070c" />
  <meta name="description" content="驚弓之鳥 Scarebird：絃聲一起，群鳥皆驚。基於 Boids 鳥群算法、支援攝影機手勢操作的趣味小遊戲。" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>驚弓之鳥 · Scarebird</title>
  <style>
    @font-face {
      font-family: "LXGW Seal";
      src: url("fonts/LXGWSeal-Regular.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
      font-display: block;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #05070c;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #game {
      width: 100%;
      height: 100%;
    }
    #game canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <!-- 右上角常驻操作：全屏切换与 GitHub 仓库 -->
  <nav id="corner-actions" aria-label="頁面操作">
    <button id="fullscreen-toggle" class="corner-btn" type="button" aria-label="进入全屏 (F)" title="全屏游玩 (F)" hidden>
      <svg class="fs-icon fs-icon-enter" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
      </svg>
      <svg class="fs-icon fs-icon-exit" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" />
      </svg>
    </button>
    <a
      id="github-link"
      class="corner-btn"
      href="https://github.com/niyongsheng/scarebird"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="GitHub 倉庫"
      title="GitHub · 源碼倉庫"
    >
      <svg class="gh-icon" viewBox="0 0 16 16" aria-hidden="true">
        <path
          d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"
        />
      </svg>
    </a>
  </nav>

  <!-- 手势摄像头 HUD：由 GestureController 控制显隐 / 更新骨架 -->
  <div id="gesture-hud" aria-hidden="true">
    <div class="gesture-frame">
      <video class="input_video" playsinline muted></video>
      <canvas class="hand-overlay"></canvas>
      <div class="gesture-badge">
        <span class="gesture-dot"></span>
        <span class="gesture-status">等待手勢</span>
      </div>
      <div class="gesture-corner tl"></div>
      <div class="gesture-corner tr"></div>
      <div class="gesture-corner bl"></div>
      <div class="gesture-corner br"></div>
    </div>
    <p class="gesture-tip">食指瞄準 · 拇指食指張開拉弓 · 合攏放弦</p>
  </div>

  <div id="rotate-hint">
    <div class="rotate-glyph">⟳</div>
    <p>請橫屏遊玩</p>
    <small>橫屏後可獲得完整視野 · 觸控拉弓同樣順手</small>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
